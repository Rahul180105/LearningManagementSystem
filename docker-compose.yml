version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: lms-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
      build:
        context: .
        dockerfile: ./apps/auth-service/Dockerfile
      container_name: lms-auth
      ports:
        - "3001:3001"
      env_file:
        - ./apps/auth-service/.env
      depends_on:
        - postgres

volumes:
  postgres_data: